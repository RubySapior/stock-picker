<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theory Archive — All Theories</title>
<link rel="stylesheet" href="styles.css">
</head>
<!--
  Theory archive: every theory ever recorded (pending / paused / right /
  wrong / abandoned), with status + tier filters and a free-text search.
  Reads the same AUTO-GENERATED dashboard.js as the main page (theories.js
  renders the list; no hand-edits to dashboard.js ever).
-->
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Theory Archive</h1>
      <div class="sub">Every theory on record &mdash; resolved, paused, and abandoned included</div>
    </div>
    <div class="asof">Data as of: <span id="asof">&mdash;</span> <a class="archiveBtn" href="index.html">&#8592; Back to dashboard</a></div>
  </header>

  <div class="panel" style="margin-bottom:20px;">
    <div class="filterbar">
      <input id="tSearch" class="searchBox" type="text" placeholder="Search title, prediction, ID, evidence&hellip;" autocomplete="off">
      <div class="btnGroup" id="statusFilters"></div>
      <div class="btnGroup" id="tierFilters"></div>
      <span class="muted small" id="tCount"></span>
    </div>
    <div class="scroll">
      <table id="theoryTable">
        <thead><tr><th>Rank</th><th>ID</th><th>Theory</th><th>Prediction</th><th>Status</th><th>Evidence Log</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>
<script src="theories.js"></script>
</body>
</html>
