<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theory Archive — All Theories</title>
<link rel="stylesheet" href="styles.css?v=6">
</head>
<!--
  Theory archive: every theory ever recorded (pending / paused / right /
  wrong / abandoned) as a flash-card wheel. Scroll, drag, or use the arrows
  to browse; click a side card to bring it to the front; click the front
  card to flip it and read the evidence log.
  Reads the same AUTO-GENERATED dashboard.js (theories.js renders the wheel;
  no hand-edits to dashboard.js ever).
-->
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Theory Archive</h1>
      <div class="sub">Flash-card wheel &mdash; every theory on record</div>
    </div>
    <div class="asof">Data as of: <span id="asof">&mdash;</span> <a class="archiveBtn" href="help.html">Help</a> <a class="archiveBtn" href="index.html">&#8592; Back to dashboard</a></div>
  </header>

  <div class="filterbar" style="margin-bottom:6px;">
    <input id="tSearch" class="searchBox" type="text" placeholder="Search title, prediction, ID, evidence&hellip;" autocomplete="off">
    <div class="btnGroup" id="statusFilters"></div>
    <div class="btnGroup" id="tierFilters"></div>
    <button id="viewToggle" class="rangeBtn" title="Switch between the flash-card wheel and the plain table">Table view &#8596;</button>
    <span class="muted small" id="tCount"></span>
  </div>

  <div class="wheelStage" id="wheelStage">
    <div class="wheel" id="wheel"></div>
    <button class="wheelBtn prev" id="wPrev" title="Previous card">&#8249;</button>
    <button class="wheelBtn next" id="wNext" title="Next card">&#8250;</button>
    <div class="wheelCounter" id="wCounter"></div>
  </div>
  <div class="wheelHint" id="wheelHint">swipe or scroll to browse &middot; tap the front card to flip &middot; tap a side card to select</div>

  <div class="panel" id="tableView" style="display:none;">
    <div class="scroll">
      <table id="theoryTable">
        <thead><tr><th>Rank</th><th>ID</th><th>Theory</th><th>Prediction</th><th>Status</th><th>Evidence Log</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>
<script src="wheel.js?v=3"></script>
<script src="theories.js?v=3"></script>
</body>
</html>
