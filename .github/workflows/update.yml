name: Live portfolio update

on:
  schedule:
    # Minimum GitHub allows for cron is every 5 minutes. Prices only change
    # during market hours, so most off-hours runs commit nothing.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch prices, run exits, regenerate dashboard
        run: python update.py

      - name: Commit changes if any
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard.js portfolio.json
          if git diff --cached --quiet; then
            echo "No data changes this run."
          else
            git commit -m "Live update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main
            git push
          fi
