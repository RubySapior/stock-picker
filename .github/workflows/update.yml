name: Live portfolio update

on:
  schedule:
    # Every hour at :00 (covers post-market → pre-open, ~1 run/hr off-hours).
    - cron: '0 * * * *'
    # Every 6 minutes during 13:00–21:59 UTC = 10 runs/hr. This envelope covers
    # US market hours in BOTH DST regimes (EDT 13:30–20:00, EST 14:30–21:00 UTC).
    # The :00 minute overlaps with the hourly line, so market hours never exceed
    # 10 runs/hour (matches the GitHub Pages ~10 builds/hour cap).
    - cron: '*/6 13-21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch prices, run exits, regenerate dashboard
        run: python update.py

      - name: Commit changes if any
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard.js portfolio.json
          if git diff --cached --quiet; then
            echo "No data changes this run."
          else
            git commit -m "Live update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main
            git push
          fi
