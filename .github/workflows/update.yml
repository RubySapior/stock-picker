name: Live portfolio update

on:
  schedule:
    # Once daily at 01:00 UTC — the ONLY run when the market is closed
    # (nights/weekends): keeps the snapshot + news fresh without flooding
    # Yahoo or burning Actions minutes. 01:00 UTC is deep in the US night in
    # both DST regimes (EDT 21:00, EST 20:00).
    - cron: '0 1 * * *'
    # Every 6 minutes during 13:00–21:59 UTC, Mon-Fri = 10 runs/hr. This
    # envelope covers the 30-min pre-open window + market hours in BOTH DST
    # regimes (EDT 09:00–17:00, EST 08:00–16:00). update.py --preopen skips
    # any run that lands outside the true pre-open/market window (the DST
    # envelope edges), so out-of-window runs are cheap no-ops.
    - cron: '*/6 13-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-update
  cancel-in-progress: false

jobs:
  # Closed-market cadence: exactly one full update per day (01:00 UTC).
  daily:
    if: github.event.schedule == '0 1 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Daily update (market closed)
        run: python update.py
      - name: Commit changes if any
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard.js portfolio.json mirror.json leaderboards.js
          if git diff --cached --quiet; then
            echo "No data changes this run."
          else
            git commit -m "Live update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main
            git push
          fi

  # Pre-open + market hours: every 6 min, gated to the true window. --preopen
  # forces the AI verdict refresh in the 30 min before the bell so orders land
  # fresh right before execution (daily AI cadence is otherwise untouched).
  schedule6:
    if: github.event.schedule == '*/6 13-21 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 6-min update (pre-open / market hours)
        run: python update.py --preopen
      - name: Commit changes if any
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard.js portfolio.json mirror.json leaderboards.js
          if git diff --cached --quiet; then
            echo "No data changes this run."
          else
            git commit -m "Live update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main
            git push
          fi
