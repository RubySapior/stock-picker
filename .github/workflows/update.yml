name: Daily portfolio update

on:
  schedule:
    # 21:30 UTC = 5:30pm ET in EDT / 4:30pm ET in EST, after US market close.
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch prices, run exits, regenerate dashboard
        run: python update.py

      - name: Commit changes if any
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard.js portfolio.json
          if git diff --cached --quiet; then
            echo "No data changes today."
          else
            git commit -m "Daily update $(date -u +%Y-%m-%d)"
            git push
          fi
